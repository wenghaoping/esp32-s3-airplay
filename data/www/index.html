<!DOCTYPE html><html lang='zh-CN'><head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>AirPlay 接收器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);min-height:100vh;padding:20px;color:#fff}
.wrap{max-width:480px;margin:0 auto}
.header{text-align:center;padding:30px 0}
.header h1{font-size:28px;font-weight:600;margin-bottom:8px}
.header p{color:#888;font-size:14px}
.status-bar{background:#0f3460;border-radius:12px;padding:16px;margin-bottom:20px;text-align:center}
.status-bar.ok{background:#1b4332}
.status-bar.err{background:#5c1a1a}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.1)}
.card h2{font-size:16px;font-weight:600;margin-bottom:16px;color:#e94560}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
input[type=text],input[type=password]{width:100%;padding:12px 14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:14px}
input:focus{outline:none;border-color:#e94560}
.btn{display:inline-block;padding:12px 20px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#d63850}
.btn-secondary{background:rgba(255,255,255,0.1);color:#fff}
.btn-secondary:hover{background:rgba(255,255,255,0.2)}
.btn-danger{background:#dc3545;color:#fff}
.btn-danger:hover{background:#c82333}
.btn-block{width:100%;margin-top:10px}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.wifi-list{max-height:180px;overflow-y:auto;margin:12px 0;border-radius:8px}
.wifi-item{padding:12px;background:rgba(0,0,0,0.2);margin-bottom:4px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.wifi-item:hover{background:rgba(233,69,96,0.2)}
.wifi-item.sel{background:rgba(233,69,96,0.3);border:1px solid #e94560}
.wifi-item .ssid{font-weight:500}
.wifi-item .rssi{font-size:12px;color:#888}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{background:rgba(0,0,0,0.2);padding:12px;border-radius:8px}
.info-item label{font-size:11px;color:#888;display:block;margin-bottom:4px}
.info-item span{font-size:14px;font-weight:500}
.msg{padding:10px;border-radius:6px;margin-top:10px;font-size:13px}
.msg.ok{background:rgba(27,67,50,0.5)}
.msg.err{background:rgba(92,26,26,0.5)}
.msg.info{background:rgba(15,52,96,0.5)}
.file-row{display:flex;gap:10px;align-items:center}
.file-name{flex:1;font-size:13px;color:#888}
.actions{display:flex;gap:10px;margin-top:10px}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;accent-color:#e94560}
.slider-row span{font-size:13px;color:#888;min-width:32px;text-align:right}
</style></head><body>
<div class='wrap'>
<div class='header'><h1>AirPlay 接收器</h1><p>ESP32 配置面板</p></div>
<div id='status-bar' class='status-bar'>正在加载…</div>
<div class='card'><h2>Wi‑Fi 网络</h2>
<button class='btn btn-secondary' onclick='scanWiFi()'>扫描网络</button>
<div id='wifi-list' class='wifi-list'></div>
<div class='form-group'><label>网络名称（SSID）</label><input type='text' id='wifi-ssid' placeholder='输入或选择网络'></div>
<div class='form-group'><label>密码</label><input type='password' id='wifi-pass' placeholder='输入密码'></div>
<button class='btn btn-primary btn-block' onclick='saveWiFi()'>连接 Wi‑Fi</button>
<div id='wifi-msg'></div></div>
<div class='card'><h2>设备设置</h2>
<div class='form-group'><label>AirPlay 设备名称</label><input type='text' id='dev-name' placeholder='我的音箱'></div>
<button class='btn btn-primary' onclick='saveName()'>保存名称</button>
<div id='name-msg'></div>
<div class='form-group' style='margin-top:18px'><label for='led-brightness'>LED 亮度</label>
<div class='slider-row'><input type='range' id='led-brightness' min='0' max='255' value='128' oninput='document.getElementById("led-pct").textContent=Math.round(this.value/255*100)+"%"'>
<span id='led-pct'>50%</span></div></div>
<button class='btn btn-secondary' onclick='saveBrightness()'>保存亮度</button>
<div id='brightness-msg'></div>
<div id='chan-group'>
<div class='form-group' style='margin-top:18px'><label for='chan-mode' id='chan-label'>输出声道</label>
<select id='chan-mode' onchange='saveChannel()'>
<option value='0'>立体声</option>
<option value='1'>仅左声道</option>
<option value='2'>仅右声道</option>
<option value='3'>单声道（左+右）</option>
</select></div>
<div id='chan-msg'></div></div>
<div id='dual-group' style='display:none;margin-top:18px'>
<div class='form-group'><label for='dual-mode'>DAC 配置</label>
<select id='dual-mode' onchange='saveDual()'>
<option value='0'>2.1（卫星箱 / 低音炮）</option>
<option value='1'>双功放</option>
</select></div>
<div id='dual-msg'></div></div>
<div id='eq-link' style='display:none;margin-top:18px'>
<a href='/eq' class='btn btn-secondary'>EQ 设置</a></div>
</div>
<div class='card'><h2>固件更新</h2>
<div class='file-row'><input type='file' id='fw-file' accept='.bin' style='display:none'>
<button class='btn btn-secondary' onclick='document.getElementById("fw-file").click()'>选择文件</button>
<span class='file-name' id='fw-name'>未选择文件</span></div>
<button class='btn btn-primary btn-block' id='ota-btn' onclick='startOTA()' disabled>上传固件</button>
<div id='ota-msg'></div></div>
<div class='card'><h2>系统信息</h2>
<div class='info-grid'>
<div class='info-item'><label>IP 地址</label><span id='info-ip'>-</span></div>
<div class='info-item'><label>MAC 地址</label><span id='info-mac'>-</span></div>
<div class='info-item'><label>设备名称</label><span id='info-name'>-</span></div>
<div class='info-item'><label>可用内存</label><span id='info-heap'>-</span></div>
<div class='info-item'><label>固件版本</label><span id='info-fw'>-</span></div>
<div class='info-item'><label>运行时长</label><span id='info-uptime'>-</span></div>
<div class='info-item'><label>最近重启原因</label><span id='info-reset'>-</span></div>
<div class='info-item'><label>Wi‑Fi SSID</label><span id='info-ssid'>-</span></div>
<div class='info-item'><label>Wi‑Fi 信号</label><span id='info-rssi'>-</span></div>
<div class='info-item'><label>Wi‑Fi 信道</label><span id='info-chan'>-</span></div>
<div class='info-item'><label>Wi‑Fi 制式</label><span id='info-phy'>-</span></div>
<div class='info-item' style='grid-column:1/-1'><label>Wi‑Fi BSSID</label><span id='info-bssid'>-</span></div>
</div>
<div class='actions'><button class='btn btn-danger' onclick='restart()'>重启设备</button></div>
</div>
<div class='card'><h2>系统日志</h2>
<p style='color:#888;font-size:13px;margin-bottom:12px'>通过 WebSocket 实时查看 ESP 日志</p>
<a href='/logs' class='btn btn-primary'>打开日志查看器</a></div>
<div class='card'><h2>Wi‑Fi 测速</h2>
<p style='color:#888;font-size:13px;margin-bottom:12px'>测试浏览器与设备之间的延迟和吞吐量</p>
<a href='/speedtest' class='btn btn-primary'>打开测速工具</a></div>
</div>
<script>
function msg(id,txt,type){var e=document.getElementById(id);if(e){e.innerHTML='<div class="msg '+type+'">'+txt+'</div>';setTimeout(function(){e.innerHTML='';},4000);}}
async function scanWiFi(){
  var l=document.getElementById('wifi-list');l.innerHTML='<div class="msg info">正在扫描…</div>';
  try{var r=await fetch('/api/wifi/scan');var d=await r.json();
    if(d.success&&d.networks.length>0){l.innerHTML='';d.networks.forEach(function(n){
      var i=document.createElement('div');i.className='wifi-item';
      i.innerHTML='<span class="ssid">'+n.ssid+'</span><span class="rssi">'+n.rssi+' dBm</span>';
      i.onclick=function(){document.querySelectorAll('.wifi-item').forEach(function(x){x.classList.remove('sel');});i.classList.add('sel');document.getElementById('wifi-ssid').value=n.ssid;};
      l.appendChild(i);});}
    else{l.innerHTML='<div class="msg info">未找到网络</div>';}}
  catch(e){l.innerHTML='<div class="msg err">扫描失败</div>';}}
async function saveWiFi(){
  var s=document.getElementById('wifi-ssid').value.trim();var p=document.getElementById('wifi-pass').value;
  if(!s){msg('wifi-msg','请输入网络名称','err');return;}
  try{var r=await fetch('/api/wifi/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:s,password:p})});
    var d=await r.json();if(d.success){msg('wifi-msg','已保存，正在重启…','ok');}else{msg('wifi-msg',d.error,'err');}}
  catch(e){msg('wifi-msg','操作失败','err');}}
async function loadBrightness(){
  try{var r=await fetch('/api/led/brightness');var d=await r.json();
    if(d.success){var s=document.getElementById('led-brightness');s.value=d.brightness;
      document.getElementById('led-pct').textContent=Math.round(d.brightness/255*100)+'%';}}
  catch(e){console.warn('Could not load LED brightness',e);}}
async function saveBrightness(){
  var v=Number.parseInt(document.getElementById('led-brightness').value,10);
  try{var r=await fetch('/api/led/brightness',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brightness:v})});
    var d=await r.json();if(d.success){msg('brightness-msg','已保存','ok');}else{msg('brightness-msg',d.error,'err');}}
  catch(e){msg('brightness-msg','操作失败','err');console.error('saveBrightness failed',e);}}
async function loadChannel(){
  try{var r=await fetch('/api/audio/channel');var d=await r.json();
    if(d.success){document.getElementById('chan-mode').value=String(d.mode);
      chanLocked=!!d.locked;chanDsp=!!d.dsp;}}
  catch(e){console.warn('Could not load channel mode',e);}
  applyChanLabels();
  applyAmpLayout();}
var dualDevices=1;
var dualMode=0;
var dualLoaded=false;
var chanLocked=false;
var chanDsp=false;
/* A bi-amp flow crosses the two outputs over into one speaker, so the choice
   is which input channel to feed it — there is no stereo to pass through. */
function applyChanLabels(){
  document.getElementById('chan-label').textContent=
    chanDsp?'输入声道':'输出声道';
  var o=document.getElementById('chan-mode').options;
  o[0].text=chanDsp?'左右混合 / 2':'立体声';
  o[3].text=chanDsp?'左右混合 / 2':'单声道（左+右）';
}
var DUAL_WARN={
  0:'切换为 2.1（卫星箱 / 低音炮）？\n\n第二块功放将配置为 PBTL 单声道：必须将 OUT_A 和 OUT_B 桥接后，连接至一个低音炮。\n\n请在重启前完成重新接线。',
  1:'切换为双功放？\n\n两块功放都将以 BTL 立体声模式工作：OUT_A 驱动低音单元，OUT_B 驱动高音单元。\n\n若 OUT_A 和 OUT_B 仍为 PBTL 低音炮而桥接，必须先断开桥接；否则两个输出会相互对抗，可能损坏功放和输出滤波器。'
};
/* With two amps the DAC configuration already fixes the routing, so per-output
   channel selection has no meaning. */
function applyAmpLayout(){
  document.getElementById('chan-group').style.display=
    (chanLocked||dualDevices>1)?'none':'';
}
async function saveChannel(){
  var v=Number.parseInt(document.getElementById('chan-mode').value,10);
  try{var r=await fetch('/api/audio/channel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:v})});
    var d=await r.json();if(d.success){msg('chan-msg','已保存','ok');
      /* The firmware may keep stereo regardless of what was asked for. */
      if(typeof d.mode==='number'){document.getElementById('chan-mode').value=String(d.mode);}
      chanLocked=!!d.locked;applyAmpLayout();}
    else{msg('chan-msg',d.error,'err');}}
  catch(e){msg('chan-msg','操作失败','err');console.error('saveChannel failed',e);}}
async function loadDual(){
  try{var r=await fetch('/api/audio/dual');if(!r.ok)return;var d=await r.json();
    if(d.success&&d.devices>1){dualDevices=d.devices;dualMode=d.mode;
      var sel=document.getElementById('dual-mode');
      sel.value=String(d.mode);
      if(!d.biamp){
        sel.querySelector('option[value="1"]').disabled=true;
        sel.querySelector('option[value="1"]').textContent='双功放（不可用）';
      }
      document.getElementById('dual-group').style.display='';
      if(d.restart_required){msg('dual-msg','请重新接线后重启设备，使配置生效。','err');}}}
  catch(e){console.warn('Could not load dual DAC mode',e);}
  applyAmpLayout();}
async function saveDual(){
  var sel=document.getElementById('dual-mode');
  var v=Number.parseInt(sel.value,10);
  if(v!==dualMode&&!confirm(DUAL_WARN[v])){sel.value=String(dualMode);return;}
  try{var r=await fetch('/api/audio/dual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:v})});
    var d=await r.json();
    if(d.success){dualMode=v;msg('dual-msg','已保存。请重新连接扬声器后重启设备，使配置生效。','ok');}
    else{sel.value=String(dualMode);msg('dual-msg',d.error,'err');}}
  catch(e){sel.value=String(dualMode);msg('dual-msg','操作失败','err');console.error('saveDual failed',e);}}
async function saveName(){
  var n=document.getElementById('dev-name').value.trim();if(!n){msg('name-msg','请输入名称','err');return;}
  try{var r=await fetch('/api/device/name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
    var d=await r.json();if(d.success){msg('name-msg','已保存，重启后生效。','ok');loadInfo();}else{msg('name-msg',d.error,'err');}}
  catch(e){msg('name-msg','操作失败','err');}}
async function startOTA(){
  var f=document.getElementById('fw-file').files[0];if(!f){msg('ota-msg','请选择文件','err');return;}
  document.getElementById('ota-btn').disabled=true;msg('ota-msg','正在上传…','info');
  try{await fetch('/api/ota/update',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});msg('ota-msg','完成，正在重启…','ok');}
  catch(e){msg('ota-msg','正在重启…','ok');}}
async function restart(){
  if(!confirm('确定要重启设备吗？'))return;
  try{await fetch('/api/system/restart',{method:'POST'});msg('','正在重启…','info');}catch(e){}}
async function loadInfo(){
  try{var r=await fetch('/api/system/info');var d=await r.json();
    if(d.success){var i=d.info;var b=document.getElementById('status-bar');
      if(i.eth_connected){b.className='status-bar ok';b.innerHTML='有线网络：'+i.ip;}
      else if(i.wifi_connected){b.className='status-bar ok';b.innerHTML='Wi‑Fi：'+i.ip;}
      else{b.className='status-bar err';b.innerHTML='未连接网络，请在下方配置 Wi‑Fi';}
      document.getElementById('info-ip').textContent=i.ip||'-';
      document.getElementById('info-mac').textContent=i.mac||'-';
      document.getElementById('info-name').textContent=i.device_name||'-';
      document.getElementById('info-heap').textContent=Math.round(i.free_heap/1024)+' KB';
      document.getElementById('info-fw').textContent=i.firmware_version||'-';
      function fmtUptime(s){if(s==null)return '-';var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
        return (d?d+' 天 ':'')+(d||h?h+' 小时 ':'')+m+' 分 '+(s%60)+' 秒';}
      document.getElementById('info-uptime').textContent=fmtUptime(i.uptime_s);
      document.getElementById('info-reset').textContent=i.reset_reason||'-';
      function rssiLabel(r){if(r==null)return '-';var q='';if(r>=-55)q='（极佳）';else if(r>=-65)q='（良好）';else if(r>=-75)q='（一般）';else q='（较弱）';return r+' dBm'+q;}
      document.getElementById('info-ssid').textContent=i.wifi_ssid||'-';
      document.getElementById('info-rssi').textContent=rssiLabel(i.wifi_rssi);
      document.getElementById('info-chan').textContent=i.wifi_channel||'-';
      document.getElementById('info-phy').textContent=i.wifi_phy||'-';
      document.getElementById('info-bssid').textContent=i.wifi_bssid||'-';
      if(i.eq_supported||i.sub_supported){document.getElementById('eq-link').style.display='';}
      /* Only a TAS58xx build registers /api/audio/dual; asking anyway logs a
         warning on the device for every page load. */
      if(i.dual_supported&&!dualLoaded){dualLoaded=true;loadDual();}
      document.getElementById('dev-name').placeholder=i.device_name||'';}}catch(e){}}
window.onload=function(){
  document.getElementById('fw-file').onchange=function(e){var f=e.target.files[0];
    document.getElementById('fw-name').textContent=f?f.name:'未选择文件';
    document.getElementById('ota-btn').disabled=!f;};
  loadInfo();loadBrightness();loadChannel();setInterval(loadInfo,30000);};
</script></body></html>
